[project]
name = "supercmo-skills"
version = "0.1.23"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "SuperCMO media client (image, video, audio): stdlib-only routing over BYO-direct vendor keys or one managed SuperCMO key."
readme = "README.md"
authors = [{ name = "Kshitiz Kumar", email = "founder@getsupercmo.ai" }]
keywords = [
    "ai",
    "agent",
    "marketing",
    "media",
    "image-generation",
    "video-generation",
    "tts",
    "byo-keys",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
# icalendar + python-dateutil serve the calendar toolset — part of the DEFAULT install, so
# `uvx supercmo-skills@<version>` works as-is with no extras. Everything else stays stdlib-only
# (the vendored no-install Claude-plugin path still runs; only the calendar tools degrade there,
# with an install hint, until the libs are present).
dependencies = [
    "icalendar>=6.0",
    "python-dateutil>=2.8",
]

# Kept as an empty alias: `supercmo-skills[calendar]` was briefly the documented spelling — it
# must keep resolving, and now means the same thing as the base install.
[project.optional-dependencies]
calendar = []

[project.urls]
Homepage = "https://github.com/SupercmoHQ/superCMO-skills"
Repository = "https://github.com/SupercmoHQ/superCMO-skills"
Issues = "https://github.com/SupercmoHQ/superCMO-skills/issues"

# The MCP server console entrypoint. Script name == distribution name so `uvx supercmo-skills`
# resolves with no `--from` (the reference-server convention; server.json points at this).
[project.scripts]
supercmo-skills = "supercmo_skills.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The lib (scripts/supercmo_skills) installs as `supercmo_skills`; supercmo_env.py installs as a
# top-level module (supercmo_skills imports it). The MCP server now lives inside the package
# (supercmo_skills/mcp) and ships automatically via `packages` below. The media skills ride along
# as package data under supercmo_skills/_assets.
[tool.hatch.build.targets.wheel]
packages = ["scripts/supercmo_skills"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/supercmo_env.py" = "supercmo_env.py"
# Map whole dirs, not per-skill — a new skills/<x>/ ships with zero edits here (hatchling
# force-include copies recursively; caches are pruned by `exclude`).
"skills" = "supercmo_skills/_assets/skills"
