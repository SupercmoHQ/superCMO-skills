[project]
name = "supercmo-skills"
version = "0.1.7"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "SuperCMO media client (image, video, audio): stdlib-only routing over BYO-direct vendor keys or one managed SuperCMO key."
readme = "README.md"
authors = [{ name = "Kshitiz Kumar", email = "founder@getsupercmo.ai" }]
keywords = [
    "ai",
    "agent",
    "marketing",
    "media",
    "image-generation",
    "video-generation",
    "tts",
    "byo-keys",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
] # stdlib-only by design (vendors into the Claude plugin with no install step)

[project.urls]
Homepage = "https://github.com/SupercmoHQ/superCMO-skills"
Repository = "https://github.com/SupercmoHQ/superCMO-skills"
Issues = "https://github.com/SupercmoHQ/superCMO-skills/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The lib (scripts/supercmo_skills) installs as `supercmo_skills`; supercmo_env.py installs as a
# top-level module (supercmo_skills imports it). The media skills ride along as package data
# under supercmo_skills/_assets.
[tool.hatch.build.targets.wheel]
packages = ["scripts/supercmo_skills"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/supercmo_env.py" = "supercmo_env.py"
# Map whole dirs, not per-skill — a new skills/<x>/ ships with zero edits here (hatchling
# force-include copies recursively; caches are pruned by `exclude`).
"skills" = "supercmo_skills/_assets/skills"
"mcp-server" = "supercmo_skills/_assets/mcp-server"         # media + analysis tools (MCP delivery)
