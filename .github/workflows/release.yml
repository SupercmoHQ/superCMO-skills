name: Release

# Tag a release (must match the version in pyproject.toml), then push the tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Publishes to PyPI via Trusted Publishing (OIDC) — no API token stored.
# One-time PyPI setup: create a Trusted Publisher for project "supercmo-skills"
#   (owner/repo of THIS repo, workflow "release.yml", environment "pypi").

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Assert tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -E '^version = "' pyproject.toml | head -1 | sed -E 's/version = "(.+)"/\1/')
          echo "tag=$tag pyproject=$ver"
          test "$tag" = "$ver"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing (OIDC) — no token in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
