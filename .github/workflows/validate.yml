# Blocking validation: structural + frontmatter lint (quick_validate), the listing gate
# (scripts smoke + spend/social --dry-run; listing_gate.py), and a plugin-bundle build smoke,
# plus the Agent Skills spec validator (skills-ref) as an advisory check.
name: Validate
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # test on the shipped floor (requires-python >=3.11), matching release.yml

      - name: Package import smoke + self-tests (blocking)
        # Installs the built wheel into a CLEAN venv (the shipped/uvx layout) and asserts the
        # library does NOT mutate sys.path on import — the exact gap that let the sys.path
        # stdlib-shadowing bug ship — then runs the modules' self-checks. Telemetry is disabled
        # so CI never phones home (the client self-test exercises the dispatch path, which records).
        env:
          SUPERCMO_TELEMETRY: "false"
          DO_NOT_TRACK: "1"
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet .
          /tmp/smoke/bin/python -c "import sys; b=list(sys.path); import supercmo_skills, supercmo_env; assert sys.path == b, f'library mutated sys.path on import: {sys.path}'; print('import smoke OK — sys.path unchanged')"
          for m in supercmo_skills supercmo_skills.client supercmo_skills.catalog supercmo_skills.readiness supercmo_skills.providers.fal supercmo_skills.providers.wavespeed; do
            echo "self-test: python -m $m"; /tmp/smoke/bin/python -m "$m"
          done
          /tmp/smoke/bin/python -m supercmo_env --selftest

      - name: Structural + frontmatter validation (blocking)
        run: |
          pip install pyyaml
          python3 scripts/quick_validate.py
          python3 scripts/sync_skills.py --check   # README skills catalog must be in sync

      - name: Listing gate — scripts smoke + spend/social --dry-run (blocking)
        run: |
          python3 scripts/listing_gate.py --selftest   # regression-test the gate logic
          python3 scripts/listing_gate.py

      - name: Shared-client seam — no raw vendor HTTP (blocking)
        run: python3 scripts/check_shared_client.py

      - name: Provider-key catalog in sync — registry vs .mcp.json/config.js (blocking)
        run: python3 scripts/check_catalog_sync.py

      - name: Plugin bundle build smoke (blocking)
        run: python3 scripts/package_plugins.py   # must build a complete supercmo-plugin.zip (pyyaml installed above)

      - name: Agent Skills spec validation (skills-ref)
        # Not yet blocking: the skills-ref CLI interface is young — verify it, then
        # remove continue-on-error to make it a hard gate.
        continue-on-error: true
        run: |
          pip install skills-ref 2>/dev/null \
            || pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref" 2>/dev/null \
            || { echo "skills-ref not installable yet — skipping"; exit 0; }
          for d in skills/*/; do
            [ -f "${d}SKILL.md" ] && skills-ref validate "$d" || true
          done

      - name: Trigger evals (advisory)
        # should-trigger / should-not-trigger per skill. Reports on PRs; never gates merge.
        continue-on-error: true
        run: python3 tests/evals/run_eval.py

  js-tests:
    # The npx installer suite (bin/lib/*.test.js) — defined in package.json, never run in CI until now.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS installer tests (blocking)
        run: npm test   # node --test bin/lib/*.test.js — zero deps, no install step needed
