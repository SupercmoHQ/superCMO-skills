# Scans every push and PR for committed secrets over the FULL history.
# Runs the OSS gitleaks binary directly — NOT gitleaks/gitleaks-action@v2, which requires a
# paid GITLEAKS_LICENSE for org-owned repos (SupercmoHQ) and hard-fails before scanning.
# The binary is MIT and needs no license. A local gitleaks pre-commit hook is an optional
# extra for maintainers.
name: Secret scan
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # full history so gitleaks scans every commit
      - name: Install gitleaks (OSS binary — no org license)
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks detect --source . --redact --verbose --exit-code 1
